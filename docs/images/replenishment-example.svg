<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d"><title id="t">Illustrative replenishment calculation</title><desc id="d">A seven-day demand forecast of 35 units, a 10 percent safety fraction, and 25 units in inventory position lead to a proposed order of 14 units.</desc><rect width="1200" height="330" rx="24" fill="#0f172a"/><text x="42" y="52" fill="#f8fafc" font-family="Arial,sans-serif" font-size="26" font-weight="bold">From a forecast to a replenishment proposal</text><text x="42" y="79" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">Illustrative calculation • no interval buffer included • no order is placed</text><rect x="40" y="105" width="255" height="158" rx="16" fill="#14283e" stroke="#285272"/><text x="60" y="141" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="16">EXPECTED SALES</text><text x="60" y="188" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="bold">35 units</text><text x="60" y="225" fill="#b8cadc" font-family="Arial,sans-serif" font-size="15">7-day protection period</text><text x="315" y="194" fill="#a4b5c9" font-family="Arial,sans-serif" font-size="28">+</text><rect x="350" y="105" width="230" height="158" rx="16" fill="#14283e" stroke="#285272"/><text x="370" y="141" fill="#a5f3d0" font-family="Arial,sans-serif" font-size="16">SAFETY BUFFER</text><text x="370" y="188" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="bold">3.5 units</text><text x="370" y="225" fill="#b8cadc" font-family="Arial,sans-serif" font-size="15">10% of expected sales</text><text x="600" y="194" fill="#a4b5c9" font-family="Arial,sans-serif" font-size="28">−</text><rect x="635" y="105" width="230" height="158" rx="16" fill="#14283e" stroke="#285272"/><text x="655" y="141" fill="#fde68a" font-family="Arial,sans-serif" font-size="16">STOCK POSITION</text><text x="655" y="188" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="bold">25 units</text><text x="655" y="225" fill="#b8cadc" font-family="Arial,sans-serif" font-size="15">On hand + in transit</text><text x="884" y="194" fill="#a4b5c9" font-family="Arial,sans-serif" font-size="28">=</text><rect x="920" y="105" width="240" height="158" rx="16" fill="#0b3945" stroke="#40d9d3"/><text x="940" y="141" fill="#7ff7e5" font-family="Arial,sans-serif" font-size="16">PROPOSED ORDER</text><text x="940" y="188" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="bold">14 units</text><text x="940" y="225" fill="#b8cadc" font-family="Arial,sans-serif" font-size="15">Rounded up from 13.5</text><text x="42" y="303" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">The API can also include a buffer based on daily upper forecast values.</text></svg>
