name: Docker image CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build the production image
        run: docker build --pull --tag retailmind-ai-forecasting:ci .

      - name: Start the built image
        run: docker run --detach --name retailmind-api-ci --publish 127.0.0.1:8000:8000 --memory 8g retailmind-ai-forecasting:ci

      - name: Smoke-test real model inference and decision APIs
        run: python3 scripts/ops/smoke_test_container.py --base-url http://127.0.0.1:8000 --startup-timeout 300

      - name: Show container logs on failure
        if: failure()
        run: docker logs retailmind-api-ci

      - name: Remove test container
        if: always()
        run: docker rm --force retailmind-api-ci || true

      - name: Log in to Docker Hub
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and publish the tested image
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "DOCKERHUB_USERNAME secret is required to publish." >&2
            exit 1
          fi
          image="docker.io/${DOCKERHUB_USERNAME}/retailmind-ai-forecasting"
          docker tag retailmind-ai-forecasting:ci "${image}:latest"
          docker tag retailmind-ai-forecasting:ci "${image}:sha-${GITHUB_SHA}"
          docker push "${image}:latest"
          docker push "${image}:sha-${GITHUB_SHA}"
